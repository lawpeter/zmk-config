# Shield-level Kconfig defaults for the Custom 65% keyboard.
# Options are added incrementally as features land (see ZMK_Firmware_PRD.md §11).

# The key matrix columns live on an MCP23017 over I2C, and I2C transfers sleep,
# so the interrupt-driven scan path is unsafe here and the matrix is polled
# instead. Deep-sleep wake is unaffected: it uses the nRF row inputs' GPIO sense
# interrupt, not the active-scan path.
#
# The mechanism is worth stating precisely, because the obvious reading is wrong
# and this was re-derived once already. Our *inputs* (rows) are native nRF GPIO
# and could raise real interrupts -- unlike the in-tree Ferris rev02 cited here
# previously, whose kscan_right node puts both col-gpios and row-gpios on its
# expander. What actually blocks interrupt mode is the output side:
# kscan_matrix_irq_callback_handler (kscan_gpio_matrix.c:179) calls
# kscan_matrix_interrupt_disable() at line 186 -- before it reschedules work at
# line 190 -- and that calls kscan_matrix_set_all_outputs(dev, 0), writing all
# 14 expander pins from ISR context. Zephyr's i2c_nrfx_twim_transfer() takes
# semaphores (k_sem_take with K_FOREVER), which is illegal in an ISR, so
# interrupt mode would sleep inside the GPIOTE ISR on the first keypress.
# The MCP23017's own INT lines are no help either -- U2 pads 19/20 are
# unconnected on this PCB.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# I2C subsystem must be opted-in explicitly; setting status="okay" on the
# &i2c0 DT node alone does NOT auto-enable CONFIG_I2C in Zephyr 3.5. Once
# I2C=y the nRF TWIM driver auto-selects from DT, and the MCP230XX GPIO
# driver dependency (depends on I2C) is satisfied.
CONFIG_I2C=y

# The MCP23017 GPIO expander driver depends on I2C (above) and is not
# auto-enabled from the DT node alone on this nRF52840 build; keep it
# explicit to avoid __device_dts_ord_N linker errors.
CONFIG_GPIO_MCP230XX=y

# EC11 encoder trigger mode — use the global thread so the sensor fires
# from interrupt context without blocking the main thread.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable pointing (mouse scroll + buttons) for the FN2 encoder layer
# (SCRL_UP/SCRL_DOWN on rotation, MCLK on push).
CONFIG_ZMK_POINTING=y

# SPI subsystem for the nice!view Sharp Memory LCD.  Same rationale as
# CONFIG_I2C above: setting status="okay" on the &spi1 node does NOT
# auto-enable CONFIG_SPI in all Kconfig paths; keep it explicit to ensure
# the sharp,ls0xx display driver (depends on SPI) links correctly.
CONFIG_SPI=y

# Step 7: Our display_modes.c owns zmk_display_status_screen(). Disabling
# NICE_VIEW_WIDGET_STATUS prevents nice_view from compiling
# custom_status_screen.c, which also defines that symbol → linker conflict.
# The nice_view widget C files (status/util/bolt) are compiled directly in
# our CMakeLists.txt so we can call zmk_widget_status_init() for mode 0.
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# LVGL fonts and drivers used by the nice_view status widget. Normally
# selected by NICE_VIEW_WIDGET_STATUS=y in the nice_view Kconfig.defconfig;
# with that option off we must enable them explicitly.
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_CANVAS=y

# WPM subsystem — enable now for Step 8; also satisfies the ZMK_WPM
# dependency that was previously pulled in by NICE_VIEW_WIDGET_STATUS.
CONFIG_ZMK_WPM=y

# Increase LVGL heap to accommodate 7 LVGL screens (default is 4096).
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Step 12: Power management tuning.
# Deep sleep after 15 minutes of inactivity (~15 µA idle current).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Debounce is deliberately NOT set here. These two Kconfig options are global
# overrides: kscan_gpio_matrix.c:34-46 gates on
# "#if CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS >= 0", so while they are set they
# shadow the devicetree properties entirely, for every kscan instance on the
# board. The matrix needs values matched to its own measured scan duration, so
# they live on the kscan_matrix node in keyboard.overlay instead, and these must
# stay unset for those to take effect.
#
# The comment that used to sit here claimed 4 ms was chosen "to lower I2C
# polling overhead". That was wrong twice over. Debounce thresholds do not
# control bus traffic at all -- debounce-scan-period-ms and poll-period-ms do --
# and the value is not even in milliseconds: the driver feeds the debouncer the
# *configured* scan period as its elapsed_ms (kscan_gpio_matrix.c:247), so a
# threshold of 4 with the default 1 ms scan period meant 5 scan iterations, and
# at the measured 14.36 ms per scan that was ~72 ms of real debounce in each
# direction. That is what was merging rapid double-taps into single keystrokes.

# BLE connection interval tuning: 12–24 × 1.25 ms = 15–30 ms.
# Balances latency (low enough for typing) vs. radio duty-cycle (power).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
